deployment:
  tasks:
    - export GIT_TERMINAL_PROMPT=0
    - /bin/touch /home/sysifosw/repositories/SysifosFrontend/tmp/restart.txt
    - PATH=/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin:$PATH cloudlinux-selector stop --json --interpreter nodejs --app-root repositories/SysifosFrontend
    - PATH=/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin:$PATH cloudlinux-selector start --json --interpreter nodejs --app-root repositories/SysifosFrontend
